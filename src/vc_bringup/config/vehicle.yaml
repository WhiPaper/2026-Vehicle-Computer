# 이 파일은 현재 프로젝트 차량의 보정된 운영 프로파일입니다.
# 다른 차량에는 vehicle.example.yaml을 복사해 실측값을 입력하고 사용하십시오.
# 길이는 m, 각도는 rad이며 ECU의 wheel radius/track width와 일치해야 합니다.
schema_version: 1

vehicle:
  calibrated: true
  base_length: 0.255
  base_width: 0.155
  base_height: 0.070
  wheel_radius: 0.0325
  wheel_width: 0.026
  wheel_base: 0.135
  track_width: 0.150

# REP-103 transform from base_link to imu_link, in metres and radians.
imu:
  x: 0.0
  y: 0.0
  z: 0.0
  roll: 0.0
  pitch: 0.0
  yaw: 0.0
