name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ROS 2 Jazzy / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run repository checks
        uses: pre-commit/action@v3.0.1

      - name: Set up ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install project-specific build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdw-dev \
            libgnutls28-dev \
            libudev-dev \
            libunwind-dev \
            libyaml-dev \
            meson \
            ninja-build \
            python3-colcon-meson \
            python3-jinja2 \
            python3-ply \
            python3-yaml \
            ros-jazzy-ament-flake8

      - name: Run Python static checks
        run: |
          source /opt/ros/jazzy/setup.bash
          ament_flake8 \
            --config setup.cfg \
            src/vc_bringup \
            src/vc_safety \
            src/vc_description/test

      - name: Build and test ROS workspace
        id: ros-ci
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: >-
            libcamera
            micro_ros_agent
            micro_ros_msgs
            vc_bringup
            vc_description
            vc_safety
            vehicle_computer
          target-ros2-distro: jazzy
          vcs-repo-file-url: file://${{ github.workspace }}/dependencies.repos
          rosdep-skip-keys: libcamera vehicle_computer_runtime
          no-symlink-install: true
          coverage-result: false
          colcon-defaults: |
            {
              "build": {
                "event-handlers": ["console_direct+"],
                "meson-args": [
                  "-Dpipelines=rpi/pisp",
                  "-Dipas=rpi/pisp",
                  "-Dtest=false",
                  "-Ddocumentation=disabled",
                  "-Dpycamera=disabled",
                  "-Dgstreamer=disabled",
                  "-Dv4l2=disabled"
                ]
              },
              "test": {
                "event-handlers": ["console_direct+"]
              }
            }

      - name: Upload colcon logs on failure
        if: ${{ failure() && steps.ros-ci.outputs.ros-workspace-directory-name != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-colcon-logs-${{ github.run_id }}
          path: ${{ steps.ros-ci.outputs.ros-workspace-directory-name }}/log/
          if-no-files-found: ignore
          retention-days: 7
